<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Drum Cockpit — Rhythm Rush</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="song-select" class="screen active">
        <h1>🥁 Rhythm Rush</h1>
        <p class="subtitle">drum the falling notes in time</p>
        <div class="songs">
            <button class="song-btn" data-song="0">
                <div class="song-name">Stack Trace</div>
                <div class="song-meta">80 BPM · Easy</div>
            </button>
            <button class="song-btn" data-song="1">
                <div class="song-name">Race Condition</div>
                <div class="song-meta">120 BPM · Medium</div>
            </button>
            <button class="song-btn" data-song="2">
                <div class="song-name">Heap Overflow</div>
                <div class="song-meta">160 BPM · Hard</div>
            </button>
        </div>
        <p class="hint">Press a drum 1-5 to hit a falling note. Drum 6 returns to coding.</p>
    </div>

    <div id="game-screen" class="screen">
        <div id="hud">
            <div class="hud-cell">
                <div class="hud-label">SCORE</div>
                <div id="score">0</div>
            </div>
            <div class="hud-cell">
                <div class="hud-label">COMBO</div>
                <div id="combo">0x</div>
            </div>
            <div class="hud-cell">
                <div class="hud-label">SONG</div>
                <div id="song-title">—</div>
            </div>
        </div>
        <canvas id="canvas"></canvas>
        <div id="lane-labels">
            <div class="lane-label">1</div>
            <div class="lane-label">2</div>
            <div class="lane-label">3</div>
            <div class="lane-label">4</div>
            <div class="lane-label">5</div>
        </div>
        <div id="judgement"></div>
    </div>

    <div id="result-screen" class="screen">
        <h1 id="result-title">Track Complete</h1>
        <div class="result-stats">
            <div><span class="result-label">Score</span><span id="result-score">0</span></div>
            <div><span class="result-label">Accuracy</span><span id="result-accuracy">0%</span></div>
            <div><span class="result-label">Max Combo</span><span id="result-combo">0x</span></div>
            <div><span class="result-label">Perfect / Good / Miss</span><span id="result-breakdown">0 / 0 / 0</span></div>
        </div>
        <p id="result-quip" class="quip"></p>
        <button id="play-again">Play again</button>
    </div>

    <script src="songs.js"></script>
    <script src="audio.js"></script>
    <script src="game.js"></script>
</body>
</html>
